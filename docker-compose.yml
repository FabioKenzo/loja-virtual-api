
services:
  mysql-loja:
    image: mysql:8
    container_name: mysql-loja
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loja_virtual
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loja-network

  spring-loja:
    build: .
    container_name: spring-loja
    ports:
      - "8080:8080"
    depends_on:
      mysql-loja:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-loja
      - DB_USER=root
      - DB_PASSWORD=root
    networks:
      - loja-network

networks:
  loja-network:
    driver: bridge
